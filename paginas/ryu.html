<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/bootstrap/css/bootstrap.min.css">
    <title>Rio</title>
</head>

<body>
    <div class="container text-center">
        <div class="card" style="width: 58rem;">
            <div id="carouselExample" class="carousel slide">
                <div class="carousel-inner">
                    <div class="carousel-item active">
                        <img src="/image/ryu_1.jpg" width="30%" height="30%" class="card-img-top" alt="Rio">
                    </div>
                    <div class="carousel-item">
                        <img src="/image/ryu_2.jpg" width="30%" height="30%" class="card-img-top" alt="Rio">
                    </div>
                    <div class="carousel-item">
                        <img src="/image/ryu_3.jpg" width="30%" height="30%" class="card-img-top" alt="Rio">
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExample"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Previous</span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExample"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon" aria-hidden="true"></span>
                    <span class="visually-hidden">Next</span>
                </button>
            </div>

            <div class="card-body">
                <h5 class="card-title">Peleador Ryo</h5>
                <p class="card-text">Ryu es el protagonista y el personaje más emblemático de la saga de videojuegos de
                    pelea Street Fighter, creada por Capcom en 1987. Es el arquetipo clásico del guerrero disciplinado
                    en
                    los juegos de lucha</p>
                <a href="/index.html" class="btn btn-primary">Regresar</a>
            </div>
        </div>
    </div>
    <script src="/bootstrap/js/bootstrap.bundle.min.js"></script>
</body>

</html>
